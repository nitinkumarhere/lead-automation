services:
  # 1. Main FastAPI Gateway Application Routing Service
  backend:
    build: .
    container_name: aviara-fastapi-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock-key}
      - API_BEARER_TOKEN=super-secret-n8n-token
    depends_on:
      - redis
    restart: unless-stopped

  # 2. Distributed Asynchronous Worker Container Pool Process Engine
  worker:
    build: .
    container_name: aviara-celery-worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock-key}
      - API_BEARER_TOKEN=super-secret-n8n-token
    depends_on:
      - redis
    restart: unless-stopped

  # 3. Asynchronous Data Broker Queue Memory Router
  redis:
    image: redis:7-alpine
    container_name: aviara-redis-broker
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 4. Automations Workflow Server Ingress Engine (Python Initialization Disabled)
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: aviara-n8n-server
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_storage_data:/home/node/.n8n
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  n8n_storage_data:
